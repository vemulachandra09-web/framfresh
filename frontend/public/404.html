<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FarmFresh</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var query = window.location.search || '';
        var hash = window.location.hash || '';
        var route = path === '/' ? '/' : path;
        window.location.replace('/#' + route + query + hash);
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
